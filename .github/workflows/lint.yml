name: lint

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install ruff
        run: pip install "ruff>=0.4"

      - name: Lint
        run: ruff check src tests
      # `ruff format --check` is intentionally NOT run yet: the
      # existing codebase has 100+ files that would need formatting.
      # Add a one-shot `ruff format` pass in a dedicated commit, then
      # enable the format check here.
